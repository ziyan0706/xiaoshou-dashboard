<html lang="zh-CN">

<style>

  .header { background: linear-gradient(135deg, #5b6cff 0%, #7a4dff 100%);

  .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .filters label { font-size: 13px; color: #5a6573; margin-right: 4px; }

                    background: #fff; font-size: 13px; color: #1f2733; min-width: 130px; }
  .filters .reset { padding: 7px 14px; border: 1px solid #5b6cff; color: #5b6cff;
                    background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(20,30,60,.06); }
  .kpi .label { font-size: 12px; color: #8a94a3; margin-bottom: 8px; }
  .kpi .value { font-size: 22px; font-weight: 700; color: #1f2733; }
  .kpi .value small { font-size: 13px; color: #8a94a3; font-weight: 500; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(20,30,60,.06); }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .hint { font-size: 11px; color: #9aa3b0; margin-bottom: 10px; }
  .chart { width: 100%; height: 320px; }
  .table-wrap { max-height: 460px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 7px 9px; text-align: left; border-bottom: 1px solid #eef1f5; white-space: nowrap; }
  th { position: sticky; top: 0; background: #f7f9fc; color: #5a6573; font-weight: 600; z-index: 1; }
  tbody tr:hover { background: #f7f9fc; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; }
  .tag-q { background: #fff3e0; color: #e08a00; }
  .tag-n { background: #eef1f5; color: #8a94a3; }
  .tag-new { background: #e6f7ee; color: #1a9c5b; }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2,1fr);} .grid,.grid2{grid-template-columns:1fr;} }

</head>

    <div class="week-badge" id="weekBadge">--周</div>

  <div class="filters">
    <span><label>部门</label><select id="fDept"><option value="">全部</option></select></span>

    <span><label>权益金标记</label><select id="fEq"><option value="">全部</option></select></span>

  <div class="kpis" id="kpis"></div>

  <div class="grid">

    <div class="card">

    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>部门分布</h3>

      <div class="chart" id="chartDept"></div>

    <div class="card">

      <div class="chart" id="chartTop"></div>

  </div>

  <div class="grid2">
    <div class="card">
      <h3>权益金标记分布</h3>
      <div class="hint">权益金兑换 / 赠送 / 空（无标记）</div>
      <div class="chart" id="chartEq"></div>
    </div>
    <div class="card">
      <h3>明细数据</h3>
      <div class="hint">插件 sheet 全部行，随筛选联动</div>
      <div class="table-wrap"><table id="tbl">

        <tbody></tbody>
      </table></div>
    </div>
  </div>

const COLORS = ['#5b6cff','#7a4dff','#00b894','#fdcb6e','#e17055','#0984e3','#e84393','#00cec9','#636e72','#fd79a8'];
const fmt = n => '¥' + Math.round(n).toLocaleString('zh-CN');
const wkNum = s => parseInt(String(s).replace('周','')) || 0;

function applyFilter(){
  const d = document.getElementById('fDept').value;
  const c = document.getElementById('fCat').value;
  const e = document.getElementById('fEq').value;
  return ROWS.filter(r =>
    (!d || r['部门']==d) &&
    (!c || r['插件归类']==c) &&
    (!e || (r['权益金标记']||'')==e)
  );
}

function weekOf(r){ return r['签约周']; }

function renderKPI(rows){
  const weeks = rows.map(wkNum).filter(w=>w>0);
  const cur = weeks.length ? Math.max(...weeks) : 0;
  const curRows = rows.filter(r=>wkNum(r['签约周'])===cur);
  const sumAmt = arr => arr.reduce((s,r)=>s+(+r['成交价格']||0),0);
  const merchants = new Set(rows.map(r=>r['BOSID'])).size;
  const cards = [
    {l:'本周销售单数 ('+cur+'周)', v:curRows.length, u:'单'},
    {l:'本周成交金额', v:fmt(sumAmt(curRows)), u:''},
    {l:'26年累计单数', v:rows.length, u:'单'},
    {l:'26年累计金额', v:fmt(sumAmt(rows)), u:''},
    {l:'购买商户数', v:merchants, u:'个'},
  ];
  document.getElementById('kpis').innerHTML = cards.map(c=>
    `<div class="kpi"><div class="label">${c.l}</div><div class="value">${c.v} <small>${c.u}</small></div></div>`
  ).join('');
  document.getElementById('weekBadge').textContent = cur ? cur+'周' : '--周';
}

let charts = {};
function getChart(id){ if(!charts[id]) charts[id]=echarts.init(document.getElementById(id)); return charts[id]; }

function renderTrend(rows){
  const map = {};
  rows.forEach(r=>{ const w=wkNum(r['签约周']); if(!w) return;
    if(!map[w]) map[w]={n:0,a:0}; map[w].n++; map[w].a+=(+r['成交价格']||0); });
  const ws = Object.keys(map).map(Number).sort((a,b)=>a-b);
  const ch = getChart('chartTrend');
  ch.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['单数','成交金额'],bottom:0},
    grid:{left:50,right:60,top:20,bottom:40},
    xAxis:{type:'category',data:ws.map(w=>w+'周')},
    yAxis:[{type:'value',name:'单'},{type:'value',name:'元',axisLabel:{formatter:v=>v>=10000?(v/10000)+'万':v}}],
    series:[
      {name:'单数',type:'bar',data:ws.map(w=>map[w].n),itemStyle:{color:'#5b6cff'},barWidth:'45%'},
      {name:'成交金额',type:'line',yAxisIndex:1,data:ws.map(w=>Math.round(map[w].a)),itemStyle:{color:'#e17055'},smooth:true}
    ]
  }, true);
}

function renderCat(rows){
  const m={}; rows.forEach(r=>{const c=r['插件归类']||'其他'; m[c]=(m[c]||0)+1;});
  const data=Object.entries(m).map(([k,v])=>({name:k,value:v})).sort((a,b)=>b.value-a.value);
  const ch=getChart('chartCat');
  ch.setOption({tooltip:{trigger:'item',formatter:'{b}: {c}单 ({d}%)'},
    legend:{bottom:0,type:'scroll'},
    series:[{type:'pie',radius:['40%','68%'],center:['50%','45%'],
      data,label:{formatter:'{b}\n{c}'},itemStyle:{color:p=>COLORS[p.dataIndex%COLORS.length]}}]}, true);
}

function renderDept(rows){
  const m={}; rows.forEach(r=>{const d=r['部门']||'其他'; if(!m[d])m[d]={n:0,a:0}; m[d].n++; m[d].a+=(+r['成交价格']||0);});
  const ks=Object.keys(m);
  const ch=getChart('chartDept');
  ch.setOption({tooltip:{trigger:'axis'},legend:{data:['单数','金额'],bottom:0},
    grid:{left:50,right:60,top:20,bottom:40},
    xAxis:{type:'category',data:ks},
    yAxis:[{type:'value',name:'单'},{type:'value',name:'元',axisLabel:{formatter:v=>v>=10000?(v/10000)+'万':v}}],
    series:[{name:'单数',type:'bar',data:ks.map(k=>m[k].n),itemStyle:{color:'#7a4dff'},barWidth:'45%'},
            {name:'金额',type:'line',yAxisIndex:1,data:ks.map(k=>Math.round(m[k].a)),itemStyle:{color:'#00b894'},smooth:true}]}, true);
}

function renderTop(rows){
  const m={}; rows.forEach(r=>{const k=r['签约主体']||'未知'; m[k]=(m[k]||0)+(+r['成交价格']||0);});
  const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10).reverse();
  const ch=getChart('chartTop');
  ch.setOption({tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:p=>p[0].name+'<br/>'+fmt(p[0].value)},
    grid:{left:110,right:40,top:10,bottom:30},
    xAxis:{type:'value',axisLabel:{formatter:v=>v>=10000?(v/10000)+'万':v}},
    yAxis:{type:'category',data:top.map(t=>t[0])},
    series:[{type:'bar',data:top.map(t=>Math.round(t[1])),itemStyle:{color:'#0984e3'},barWidth:'55%',
      label:{show:true,position:'right',formatter:p=>fmt(p.value)}}]}, true);
}

function renderEq(rows){
  const m={'权益金兑换':0,'赠送':0,'空（无标记）':0};
  rows.forEach(r=>{const e=r['权益金标记']||''; if(e==='权益金兑换')m['权益金兑换']++; else if(e==='赠送')m['赠送']++; else m['空（无标记）']++;});
  const data=Object.entries(m).map(([k,v])=>({name:k,value:v}));
  const ch=getChart('chartEq');
  ch.setOption({tooltip:{trigger:'item',formatter:'{b}: {c}单'},
    legend:{bottom:0},
    series:[{type:'pie',radius:['42%','70%'],center:['50%','45%'],data,
      label:{formatter:'{b}\n{c}'},
      itemStyle:{color:p=>['#fdcb6e','#e17055','#dfe4ea'][p.dataIndex]}}]}, true);
}

function renderTable(rows){
  const tb=document.querySelector('#tbl tbody');
  const sorted=[...rows].sort((a,b)=>wkNum(b['签约周'])-wkNum(a['签约周']));
  tb.innerHTML=sorted.map(r=>{
    const eq=r['权益金标记']||'';
    const eqTag=eq?`<span class="tag tag-q">${eq}</span>`:`<span class="tag tag-n">空</span>`;
    const isNew=r['是否本周新增']==='本周新增';
    const newTag=isNew?`<span class="tag tag-new">本周新增</span>`:`<span class="tag tag-n">否</span>`;
    return `<tr><td>${r['签约主体']||''}</td><td>${r['BOSID']||''}</td><td>${r['签约周']||''}</td>
      <td>${r['签约时间']||''}</td><td>${r['插件归类']||''}</td><td>${fmt(+r['成交价格']||0)}</td>
      <td>${r['签约团队']||''}</td><td>${r['部门']||''}</td><td>${r['客户解决方案']||''}</td>
      <td>${eqTag}</td><td>${newTag}</td></tr>`;
  }).join('');
}

function fillSelects(){
  const uniq=k=>[...new Set(ROWS.map(r=>r[k]).filter(Boolean))];
  const fill=(id,arr)=>{const s=document.getElementById(id); arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});};
  fill('fDept', uniq('部门'));
  fill('fCat', uniq('插件归类'));
  fill('fEq', ['权益金兑换','赠送','']);
}

function renderAll(){
  const rows=applyFilter();
  renderKPI(rows); renderTrend(rows); renderCat(rows); renderDept(rows);
  renderTop(rows); renderEq(rows); renderTable(rows);
}
